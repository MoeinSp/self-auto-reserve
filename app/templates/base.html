<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>سلف خودکار</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e39a10'/%3E%3Ccircle cx='16' cy='17' r='7.5' fill='none' stroke='%23241a05' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% from "_ui.html" import mark %}
  <header class="top">
    <a class="brand" href="/">{{ mark() }}<span class="brand-name">سلف خودکار<small>رزرو خودکار غذا</small></span></a>
    {% block header_extra %}{% endblock %}
  </header>
  <main>
    {% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
